F.innerHTML=`<button class="x" onclick="closeTopic()">✕ close</button><div class="fp" style="background-image:linear-gradient(transparent 55%,#0a0f26),url(${ph})"></div><div class="ft"><h3 style="margin-top:0">secret photo · ${found.size}/${SP.length} found</h3><h1>${esc(t)}</h1><p class="big">${esc(c)}</p>${i===2?'<button onclick="say()">▶ listen</button> ':''}${found.size===SP.length?'<p class="hand">you found every secret photo ✦ you’re officially a regular.</p><button class="pri" onclick="openRoom()">🔓 enter the secret room</button>':''}</div>`;F.classList.add('on');F.scrollTop=0;document.body.style.overflow='hidden'}
const ROOM_NOTE='thank you for looking this closely. i hope your night is soft. — '+ME.name;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
function door(){beep(300,.15);found.size>=SP.length?openRoom():toast('locked 🔒 · find all '+SP.length+' secret photos first ('+found.size+'/'+SP.length+')')}
function openRoom(){const F=$('#full'),mix=[...LUCKY].sort(()=>Math.random()-.5).slice(0,10);beep(392,.4);setTimeout(()=>beep(587,.5),200);
F.innerHTML=`<div class="sf">${Array.from({length:70},()=>`<i class="st" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></i>`).join('')}</div><button class="x" onclick="closeTopic()">✕ leave</button>

<h3>the radio</h3><div class="chips" style="justify-content:center">${['pad','rain','hum','off'].map(t=>`<button class="sm" onclick="ambient('${t}')">${t}</button>`).join('')}</div>
<h3>the midnight mix</h3><div class="chips" style="justify-content:center">${mix.map(([a,b])=>`<a class="chip" target="_blank" rel="noopener" href="${yt(a,b)}">♪ ${esc(a)} · ${esc(b)}</a>`).join('')}</div>
